<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FloodGuard — Create Account</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="brand"><div class="brand-icon">≈</div>FloodGuard</div>
<main class="auth-page"><section class="card"><h1>Create your account</h1><p class="subtitle">Join FloodGuard and stay ahead of flood risks</p>
<div id="success" class="success"></div><form id="signupForm">
<div class="field"><label>Full Name</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 3.7-6 8-6s7 2 8 6"/></svg><input id="fullName" placeholder="Your full name"></div><div id="nameError" class="error"></div></div>
<div class="field"><label>Email Address</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="email" type="email" placeholder="you@example.com"></div><div id="emailError" class="error"></div></div>
<div class="field"><label>Password</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" placeholder="Create a password"></div><div class="hint">Use at least 8 characters with a number and special character.</div><div id="passwordError" class="error"></div></div>
<div class="field"><label>Confirm Password</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="10" width="14" height="11" rx="2"/></svg><input id="confirmPassword" type="password" placeholder="Confirm your password"></div><div id="confirmError" class="error"></div></div>
<label class="checkbox"><input id="terms" type="checkbox"><span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a><div id="termsError" class="error"></div></span></label>
<div id="formError" class="error"></div><button id="submitBtn" class="btn" type="submit">Create Account</button></form>
<div class="divider">OR</div><button class="social" type="button">ⓖ &nbsp; Continue with Google</button>
<div class="footer">Already have an account? <a href="/login">Sign in</a></div></section></main>
<script src="/auth.js"></script><script>redirectIfAuthenticated();</script><script>document.getElementById("signupForm").addEventListener("submit",signup);</script></body></html>
